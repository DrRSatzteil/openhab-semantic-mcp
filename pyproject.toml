[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhab-semantic-mcp"
version = "0.1.0"
description = "A lightweight MCP server for OpenHAB semantic operations"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Thomas Lauterbach", email = "drrsatzteil@web.de"}
]
maintainers = [
    {name = "Thomas Lauterbach", email = "drrsatzteil@web.de"}
]
keywords = ["openhab", "mcp", "semantic", "home-automation", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "requests",
    "sseclient-py",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "mcp",
    "aiohttp",
    "caldav",
    "vobject",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
    "types-requests",
    "sphinx",
    "sphinx-rtd-theme",
    "build",
    "twine",
    "wheel",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio", 
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/thomas-lauterbach/openhab-semantic-mcp"
Repository = "https://github.com/thomas-lauterbach/openhab-semantic-mcp"
Documentation = "https://github.com/thomas-lauterbach/openhab-semantic-mcp#readme"
"Bug Tracker" = "https://github.com/thomas-lauterbach/openhab-semantic-mcp/issues"

[project.scripts]
openhab-semantic-mcp = "openhab_semantic_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["openhab_semantic_mcp"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
